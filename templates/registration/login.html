{% extends 'base.html' %}

{% block title %}
    Вход
{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card">
                <div class="card-body">
                    <h2 class="card-title mb-4">Вход в систему</h2>

                    {% if form.errors %}
                        <div class="alert alert-danger">
                            Неверное имя пользователя или пароль.
                        </div>
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label" for="id_username">Имя пользователя</label>
                            <input class="form-control" type="text" name="username" id="id_username" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="id_password">Пароль</label>
                            <input class="form-control" type="password" name="password" id="id_password" required>
                        </div>

                        <input type="hidden" name="next" value="{{ next }}">
                        <button class="btn btn-primary w-100" type="submit">Войти</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
